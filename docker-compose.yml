# 显式指定项目名：compose 默认用「目录名」当项目名，一旦目录被重命名，
# 它会当成新项目、去挂一个全新的空 pgdata 卷 —— 看起来就像数据库丢了。
# 写死名字就不会因为这个原因踩坑。
name: billmanagement

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bill}
      POSTGRES_DB: ${POSTGRES_DB:-bill}
      TZ: ${TIMEZONE:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bill} -d ${POSTGRES_DB:-bill}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-bill}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bill}
      DB_NAME: ${POSTGRES_DB:-bill}
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
      APP_PASSWORD: ${APP_PASSWORD:-}
      CRYPTO_SECRET: ${CRYPTO_SECRET:-}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  pgdata:
